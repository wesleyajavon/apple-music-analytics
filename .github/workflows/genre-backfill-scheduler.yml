name: Genre Backfill Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genre-backfill-scheduler
  cancel-in-progress: false

jobs:
  run-genre-backfill-slice:
    name: Trigger run-once backfill slice
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate required secrets
        env:
          GENRE_BACKFILL_RUN_ONCE_URL: ${{ secrets.GENRE_BACKFILL_RUN_ONCE_URL }}
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          if [ -z "$GENRE_BACKFILL_RUN_ONCE_URL" ]; then
            echo "Missing secret: GENRE_BACKFILL_RUN_ONCE_URL"
            exit 1
          fi
          if [ -z "$INTERNAL_CRON_SECRET" ]; then
            echo "Missing secret: INTERNAL_CRON_SECRET"
            exit 1
          fi

      - name: Call internal run-once endpoint
        env:
          GENRE_BACKFILL_RUN_ONCE_URL: ${{ secrets.GENRE_BACKFILL_RUN_ONCE_URL }}
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          echo "Calling $GENRE_BACKFILL_RUN_ONCE_URL"
          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $INTERNAL_CRON_SECRET" \
            --header "Content-Type: application/json" \
            "$GENRE_BACKFILL_RUN_ONCE_URL"
