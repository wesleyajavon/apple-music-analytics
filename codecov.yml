coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # Diff-only metric; Next UI churn is rarely covered by Vitest — report without gating CI.
        informational: true

ignore:
  - "__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
